# 天气位置: 点栏上的天气图标(未配置时是 ⚙) → 面板里搜城市(或手填坐标), 即时生效。
# 平时不用手改这个文件 —— 面板搜索选点会把它写成 lat= / lon= / city= 三行;
# 搜索不可用(离线)时也可以照下面的格式手填。
#
# 这个文件是出包时自带的默认值(出包时由 tools/make-dist.sh 从 defaults/ 复制成 weather.conf):
# 坐标留空 = 栏上天气图标只显示 ⚙, 点开面板直接进位置编辑, 填上位置就开始拉数据。
#
# 面板搜索不够用时的辅助手段:
#   1) 高德坐标拾取器 https://lbs.amap.com/tools/picker (国内能开, 中文界面),
#      它是 GCJ-02(与 WGS-84 差几百米), 对 ~11km 的天气网格无所谓, 照抄即可。
#   2) 按出口 IP 猜一个(只到城市级, 可能不准): curl -sS https://ipinfo.io/json
#      注意: 本机走代理时这个结果会跟着节点变, 所以只当"猜一次"用,
#      猜完就写死 —— 不要在运行期依赖 IP 定位。
#
# city= 是可选的显示用城市名(面板搜索选点会自动写入; 手填可以不写)。
# 坐标填错会显示别的城市的天气; 留空 / 填 0 = 天气一直停在未配置态(栏上 ⚙)。
lat=
lon=
