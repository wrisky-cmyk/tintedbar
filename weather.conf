# 天气位置: 手填经纬度(改完即时生效, 不用重载配置)。
# 两个都要有; 缺一个、或整个文件不在 → 天气模块不显示(栏上不占位, 不报错)。
#
# 这个文件是出包时自带的默认值(出包时由 tools/make-dist.sh 从 defaults/ 复制成 weather.conf):
# 坐标留空 = 天气模块先不显示, 填上自己的就出现。
#
# 怎么查自己的坐标:
#   1) 查地名最省事 —— Open-Meteo 自家的地理编码接口, 和天气接口同一家, 直连 ~1s 通:
#      curl -sS "https://geocoding-api.open-meteo.com/v1/search?name=杭州&count=3&language=zh"
#      结果里的 latitude / longitude 就是(中文字名直接用中文; 省/市级最稳)。
#      ⚠️ 带"区/县"的名字常常查不到(实测"余杭区"、"余杭"都返回空), 那就退到所属城市 ——
#      天气网格本来就有 ~11km, 城市级坐标绰绰有余。
#   2) 想在地图上点: 高德坐标拾取器 https://lbs.amap.com/tools/picker (国内能开, 中文界面),
#      它是 GCJ-02(与 WGS-84 差几百米), 对 11km 的网格无所谓, 照抄即可。
#   3) 按出口 IP 猜一个(只到城市级, 可能不准): curl -sS https://ipinfo.io/json
#      注意: 本机走代理时这个结果会跟着节点变, 所以只当"猜一次"用,
#      猜完就把数写死在这里 —— 不要在运行期依赖 IP 定位。
#
# 填得不对就整天显示别的城市; 不填 / 填 0 = 天气模块一直隐藏。
lat=
lon=
