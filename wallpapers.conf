# 壁纸映射(归 quickshell 管): 每行 "输出名=图片路径" 或 "输出名=#RRGGBB"
#
#   *         没单独列出的输出用的兜底
#   输出名     `hyprctl monitors` / `niri msg outputs` 里查(如 HDMI-A-1)
#   路径       可用 ~ ; 想要非铺满的填充方式就写 "路径|contain" 或 "路径|tile"
#   #RRGGBB    不铺图, 只铺这个纯色(#RGB 也行; 锁屏用同一个色)
#
# 这个文件是出包时自带的默认值(出包时由 tools/make-dist.sh 从 defaults/ 复制成 wallpapers.conf):
# 一个纯色, 不改也能直接跑 —— 包里不带图片。
# 想换成图片壁纸: 把自己的图放进同目录的 wallpapers/, 再把最后两行搬上来。
# 改完立刻生效(改文件即时重读), 想手动重读: quickshell ipc call wallpaper reload
*=#1e1e2e

# *=~/.config/quickshell/wallpapers/wall.png
# HDMI-A-1=~/.config/quickshell/wallpapers/wall.png
